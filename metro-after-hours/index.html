<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121d25">
<title>地铁·夜行 3.0 | 自由破坏沙盒</title>
<style>html,body{margin:0;min-height:100%;background:#101b23;color:#ecf1e9;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:560px;margin:13vh auto;padding:28px}h1{font-size:34px;letter-spacing:3px}p{line-height:1.9;color:#adc0c4}small{letter-spacing:2px;color:#edb477}progress{width:100%;height:7px;accent-color:#edb477}button{background:#edb477;color:#14232a;border:0;border-radius:8px;padding:13px 24px;font:inherit}</style>
</head><body>
<main><small>CHAOS 3.0 / 自由驾驶 · 自由破坏</small><h1>地铁·夜行</h1><p id="status">正在载入驾驶室、碰撞目标和破坏试验场…</p><progress id="progress" max="8" value="0"></progress><p>开门行车 · 自由切轨 · 可碰撞车辆 · 残骸留场<br>脱轨后可直接修复继续。无需下载，手机请横屏。</p><button id="retry" hidden onclick="location.reload()">重新载入</button></main>
<script src="driving-2.0.js"></script>
<script>
(async()=>{
try {
 if(typeof upgradeMetro!=='function')throw Error('驾驶组件未能载入，请刷新重试。');
 if(!('DecompressionStream' in window))throw Error('请使用支持游戏解压的新版 Chrome、Edge 或 Safari。');
 let completed=0;
 const root=new URL('./',document.baseURI);
 async function read(name){const r=await fetch(new URL(name,root));if(!r.ok)throw Error('资源加载失败：'+name+'（'+r.status+'）');const text=(await r.text()).trim();document.getElementById('progress').value=++completed;return text;}
 async function unzip(text){const bytes=Uint8Array.from(atob(text),c=>c.charCodeAt(0));return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
 const [baseParts,chaosParts]=await Promise.all([Promise.all([0,1,2,3,4].map(i=>read('data'+i+'.txt'))),Promise.all([0,1,2].map(i=>read('chaos3-'+i+'.txt')))]);
 const [original,source]=await Promise.all([unzip(baseParts.join('')),unzip(chaosParts.join(''))]);
 if(!original.startsWith('<!doctype html>')||!source.includes('function upgradeMetroSandbox'))throw Error('游戏数据不完整，请重新载入。');
 const script=document.createElement('script');script.textContent=source;document.head.appendChild(script);
 if(typeof upgradeMetroSandbox!=='function')throw Error('沙盒组件未能启动，请重新载入。');
 const game=upgradeMetroSandbox(upgradeMetro(original));
 document.open();document.write(game);document.close();
} catch(error){document.getElementById('status').textContent=error.message;document.getElementById('retry').hidden=false;}
})();
</script></body></html>
